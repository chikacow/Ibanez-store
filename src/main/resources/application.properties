server.port = 8082
server.error.include-stacktrace=always

spring.application.name=pet-project

#update create-drop
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/ibanez
spring.datasource.username=root
spring.datasource.password=mysqL2004@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql: true

#dont like static files, spring dont allowed to add many path to view here but config in class
#classpath:/ it self is not the default. The default should be classpath:/templates
spring.thymeleaf.prefix=classpath:/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.web.resources.static-locations=classpath:/static/, class


