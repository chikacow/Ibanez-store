<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" type="text/css" th:href="@{/css/demo.css}">
</head>
<body class="bg-gray-100">
<div class="flex">
    <!-- Sidebar -->
    <div th:replace="admin/layout/sidebar :: sidebar"></div>

    <!-- Main content -->
    <div class="flex-1 flex flex-col h-screen overflow-y-scroll">
        <!-- Header -->
        <header class="bg-white shadow p-4">
            <h1 class="text-2xl font-semibold">Product Details</h1>
        </header>

        <!-- Main Content -->
        <main class="p-6">
            <div th:object="${theProduct}" class="bg-white p-6 rounded-lg shadow-lg max-w-4xl mx-auto">
                <!-- Product Information -->
                <div class="mb-8">
                    <h2 class="text-2xl font-semibold mb-4">Product Information</h2>
                    <div class="bg-gray-50 p-6 rounded-lg shadow-sm">
                        <div class="mb-4">
                            <h3 class="text-lg font-medium text-gray-900">Product ID</h3>
                            <p th:text="*{id}" class="text-gray-700 mt-1"></p>
                        </div>
                        <div class="mb-4">
                            <h3 class="text-lg font-medium text-gray-900">Product Name</h3>
                            <p th:text="*{name}" class="text-gray-700 mt-1"></p>
                        </div>
                        <div class="mb-4">
                            <h3 class="text-lg font-medium text-gray-900">Description</h3>
                            <p th:text="*{description}" class="text-gray-700 mt-1"></p>
                        </div>
                        <div class="mb-4">
                            <h3 class="text-lg font-medium text-gray-900">Main image</h3>
                            <p th:text="*{mainImage}" class="text-gray-700 mt-1"></p>
                        </div>
                        <div class="mb-4">
                            <h3 class="text-lg font-medium text-gray-900">Category</h3>
                            <p th:text="*{productSeries.productLine.category.name}" class="text-gray-700 mt-1"></p>
                        </div>
                        <div class="mb-4">
                            <h3 class="text-lg font-medium text-gray-900">Product Line</h3>
                            <p th:text="*{productSeries.productLine.name}" class="text-gray-700 mt-1"></p>
                        </div>
                        <div class="mb-4">
                            <h3 class="text-lg font-medium text-gray-900">Product Series</h3>
                            <p th:text="*{productSeries.name}" class="text-gray-700 mt-1"></p>
                        </div>

                        <div class="flex justify-between items-center mb-6">
                            <div class="flex space-x-4">
                                <a th:href="@{/admin/product/update/{id} (id = ${theProduct.id})}" class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700">Edit Product</a>
                                <a th:href="@{/admin/product/delete/{id} (id = ${theProduct.id})}" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">Delete Product</a>
                            </div>
                            <a th:href="@{/admin/category}" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Back to Products</a>
                        </div>

                    </div>
                </div>

                <!-- Feature List -->
                <div class="mb-8">
                    <h2 class="text-2xl font-semibold mb-4">Feature List</h2>
                    <div class="bg-gray-50 p-6 rounded-lg shadow-sm">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-blue-600 text-white">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">No.</th>
                                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Feature title</th>
                                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Action</th>
                            </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                            <tr th:each="feature, featureStat : *{features}">
                                <td th:text="${featureStat.index + 1}" class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900"></td>
                                <td th:text="${feature.title}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"></td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                    <a th:href="@{/admin/feature/{id} (id=${feature.id})}" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">View</a>
                                    <a th:href="@{/admin/feature/update/{id} (id=${feature.id})}" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">Edit</a>
                                    <a th:href="@{/admin/feature/delete/{id} (id=${feature.id})}" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">Delete</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Color List -->
                <div class="mb-8">
                    <h2 class="text-2xl font-semibold mb-4">Color List</h2>
                    <div class="bg-gray-50 p-6 rounded-lg shadow-sm">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-blue-600 text-white">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">No.</th>
                                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Color Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Action</th>
                            </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                            <tr th:each="color, colorStat : *{colors}">
                                <td th:text="${colorStat.index + 1}" class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900"></td>
                                <td th:text="${color.name}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"></td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                    <a th:href="@{/admin/color/{id} (id=${color.id})}" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">View</a>
                                    <a th:href="@{/admin/color/update/{id} (id=${color.id})}" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">Edit</a>
                                    <a th:href="@{/admin/color/delete/{id} (id=${color.id})}" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">Delete</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<script type="text/javascript" th:src="@{/js/demo.js}"></script>
</body>
</html>
