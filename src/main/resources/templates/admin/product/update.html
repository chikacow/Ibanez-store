<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Update Product</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/demo.css}">
</head>
<body>
<h2>Update a product</h2>
<form role="form"
      method="post"
      enctype="multipart/form-data"
      th:object="${alterProduct}"
      th:action="@{/admin/product/update/{id} (id = ${productId} , fromSignature = ${fromSignature})}">
    <input type="number" style="display:none" th:field="*{id}"/>

    <label>Name: </label>
    <input type="text" th:field="*{name}"/>
    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    <br/>
    <label>Description: </label>
    <input type="text" th:field="*{description}"/>
    <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
    <br/>
    <label>Product line: </label>
    <select th:field="*{productLine}">
        <option value="" disabled>Select a prodLine</option>
        <option th:each="prodLine, prodLineStat : ${prodLineList}" th:value="${prodLine.id}" th:text="${prodLine.name}" ></option>
    </select>
    <br/>
    <label for="productImg">Images: </label>
    <input id="productImg" name="productImg" type="file"/>

    <br/>
    <label>Colors: </label>
    <ul th:each="color, colorStat : *{colors}">
        <li th:text="${color.id}"></li>
        <li th:text="${color.name}"></li>
        <li th:text="${color.alias}"></li>
        <li th:text="${color.colorCode}"></li>
        <a th:href="@{/admin/color/update/{id} (id = ${color.id}, productId=${productId} )}">update this color</a><br/>
        <a th:href="@{/admin/color/delete/{id} (id = ${color.id}, productId=${productId} )}">delete this color</a><br>
    </ul>

    <br/><br/>

    <label>Features: </label>
    <ul th:each="feature, featureStat : *{features}">
        <li th:text="${feature.id}"></li>
        <li th:text="${feature.title}"></li>
        <li th:text="${feature.details}"></li>
        <li th:text="${feature.image}"></li>
        <img th:src="@{/images/features/{pics} (pics = ${feature.image})}" style="width: 100px; height:100px" ><br/>
        <a th:href="@{/admin/feature/update/{id} (id = ${feature.id} )}">update this feature</a><br/>
        <a th:href="@{/admin/feature/delete/{id} (id = ${feature.id} )}">delete this feature</a><br>
    </ul>
    <br/>
    <button type="submit">Update Product</button>
</form>

<br/><br/>

<h2>Create another feature for above product</h2>
<form role="form"
      method="post"
      enctype="multipart/form-data"
      th:object="${newFeature}"
      th:action="@{/admin/feature/create/{id} (id=${productId}, onUpdate=true)}"
>

    <label>Title</label>
    <input type="text" th:field="*{title}"/>
    <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
    <br/>
    <label>Details</label>
    <input type="text" th:field="*{details}" />
    <div th:if="${#fields.hasErrors('details')}" th:errors="*{details}"></div>
    <br/>
    <label>Image</label>
    <input type="file" name="featureImage" />
    <!--    th:field="*{image}"-->
    <br/>
    <label>hidden productId</label>
    <input type="number" name="testId" th:value="${productId}" style="display:block"/>
    <p>Count: <span th:text="${productId}"></span></p>


    <button type="submit">Create new Feature</button>


</form>

<br/><br/>
<h2>Create new color for above product</h2>
<form role="form"
      method="post"
      enctype="multipart/form-data"
      th:object="${newColor}"
      th:action="@{/admin/color/create/{id} (id=${productId}, onUpdate=true)}"
>
    <label>Color code: </label>
    <input type="text" th:field="*{colorCode}"/>
    <div th:if="${#fields.hasErrors('colorCode')}" th:errors="*{colorCode}"></div>
    <br/>
    <label>Color name: </label>
    <input type="text" th:field="*{name}"/>
    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    <br/>
    <label>Color alias: </label>
    <input type="text" th:field="*{alias}"/>
    <div th:if="${#fields.hasErrors('alias')}" th:errors="*{alias}"></div>
    <br/>
    <label>Image</label>
    <input type="file" name="colorImg" />
    <br/>
    <button type="submit">Create new Color</button>


</form>



<script type="text/javascript" th:src="@{/js/demo.js}"></script>
</body>
</html>
