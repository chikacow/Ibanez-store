<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Update Product</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/demo.css}">
</head>
<body>
<h2>Update a product</h2>
<form role="form"
      method="post"
      enctype="multipart/form-data"
      th:object="${alterProduct}"
      th:action="@{/admin/product/update/{id} (id = ${productId})}">
    <input type="number" style="display:none" th:field="*{id}"/>
    <label>Name: </label>
    <input type="text" th:field="*{name}"/>
    <br/>
    <label>Description: </label>
    <input type="text" th:field="*{description}"/>
    <br/>
    <label>Product line: </label>
    <select th:field="*{productLine}">
        <option value="" disabled>Select a prodLine</option>
        <option th:each="prodLine, prodLineStat : ${prodLineList}" th:value="${prodLine.id}" th:text="${prodLine.name}" ></option>
    </select>
    <br/>
    <label for="productImg">Images: </label>
    <input id="productImg" name="productImg" type="file"/>

    <br/>
    <label>Colors: </label>
    <ul th:each="color, colorStat : *{colors}">
        <li th:text="${color.id}"></li>
        <li th:text="${color.name}"></li>
        <li th:text="${color.alias}"></li>
        <li th:text="${color.colorCode}"></li>
    </ul>

    <br/><br/>

    <label>Features: </label>
    <ul th:each="feature, featureStat : *{features}">
        <li th:text="${feature.id}"></li>
        <li th:text="${feature.title}"></li>
        <li th:text="${feature.details}"></li>
        <li th:text="${feature.image}"></li>
        <img th:src="@{/images/features/{pics} (pics = ${feature.image})}" style="width: 100px; height:100px" >
    </ul>

    <button type="submit">Create Product</button>
</form>
