<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Create Feature</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/demo.css}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="flex">
    <!-- Sidebar -->
    <div th:replace="admin/layout/sidebar :: sidebar"></div>

    <!-- Main content -->
    <div class="flex-1 flex flex-col h-screen overflow-y-scroll">
        <!-- Header -->
        <header class="bg-white shadow p-4 flex justify-between items-center">
            <h1 class="text-2xl font-semibold">Create New Color</h1>
            <a href="category-list.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                Back to Categories
            </a>
        </header>

        <!-- Main Content -->
        <main class="p-6">
            <div class="bg-white p-6 rounded-lg shadow-lg max-w-md mx-auto">
                <h2 class="text-xl font-semibold mb-4">New Color</h2>
                <form role="form"
                      method="post"
                      enctype="multipart/form-data"
                      th:action="@{/admin/color/create/{id} (id = ${productId}, selfCreate=true)}"
                      th:object="${newColor}">
                    <div class="mb-4">
                        <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                        <input type="text" th:field="*{name}" id="name" name="name" placeholder="Enter color name"
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-500 text-xs mt-1"></p>

                    </div>
                    <div class="mb-4">
                        <label for="alias"  class="block text-sm font-medium text-gray-700">Alias</label>
                        <input type="text" th:field="*{alias}" id="alias" name="alias" placeholder="Enter color alias"
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <p th:if="${#fields.hasErrors('alias')}" th:errors="*{alias}" class="text-red-500 text-xs mt-1"></p>

                    </div>
                    <div class="mb-4">
                        <label for="colorCode" class="block text-sm font-medium text-gray-700">Color code</label>
                        <textarea id="colorCode" type="text" th:field="*{colorCode}" name="colorCode" rows="4" placeholder="Enter color code"
                                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                        <p th:if="${#fields.hasErrors('colorCode')}" th:errors="*{colorCode}" class="text-red-500 text-xs mt-1"></p>

                    </div>
                    <div class="mb-4">
                        <label for="leftFileUpload" class="block text-sm font-medium text-gray-700">Upload Image</label>
                        <input type="file" id="leftFileUpload" name="colorImg"
                               class="mt-1 block w-full px-3 py-2 h-10 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <div class="flex justify-end">
                        <button type="submit"
                                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Create Color</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>


<script type="text/javascript" th:src="@{/js/demo.js}"></script>
</body>
</html>
