<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>temo</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/demo.css}">
</head>
<body>
<form role="form"
      method="post"
      enctype="multipart/form-data"
      th:object="${alterColor}"
      th:action="@{/admin/color/update/{id} (id=${colorId}, productId=${productId}) }"
>
    <input type="number" th:field="*{id}"/>
    <label>Color code: </label>
    <input type="text" th:field="*{colorCode}"/>
    <br/>
    <label>Color name: </label>
    <input type="text" th:field="*{name}"/>
    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    <br/>
    <label>Color alias: </label>
    <input type="text" th:field="*{alias}"/>
    <div th:if="${#fields.hasErrors('alias')}" th:errors="*{alias}"></div>
    <br/>
    <label>Image</label>
    <input type="file" name="colorImg" />
    <br/>
    <button type="submit">Update Color</button>


</form>


<script type="text/javascript" th:src="@{/js/demo.js}"></script>
</body>
</html>
