<div class="flex">
    <!-- Sidebar -->
    <div th:replace="admin/layout/sidebar :: sidebar"></div>

    <!-- Main content -->
    <div class="flex-1 flex flex-col h-screen overflow-y-scroll">
        <!-- Header -->
        <header class="bg-white shadow p-4 flex justify-between items-center">
            <h1 class="text-2xl font-semibold">Update Feature</h1>

        </header>

        <!-- Main Content -->
        <main class="p-6">
            <div class="bg-white p-6 rounded-lg shadow-lg max-w-md mx-auto">
                <h2 class="text-xl font-semibold mb-4">New Feature</h2>
                <form role="form"
                      method="post"
                      enctype="multipart/form-data"
                      th:object="${alterFeature}"
                      th:action="@{/admin/feature/update/{id} (id=${featureId}, onCreate=${onCreate})}"
                >
                    <input type="number" th:field="*{id}" style="display:none">
                    <input type="number" th:field="*{product.id}" style="display:none">
                    <div class="mb-4">
                        <label for="title"  class="block text-sm font-medium text-gray-700">Title</label>
                        <input type="text" th:field="*{title}" id="title" name="title" placeholder="Enter feature title"
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-red-500 text-xs mt-1"></p>

                    </div>
                    <div class="mb-4">
                        <label for="details" class="block text-sm font-medium text-gray-700">Description</label>
                        <textarea id="details" type="text" th:field="*{details}" name="details" rows="4" placeholder="Enter feature details"
                                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                        <p th:if="${#fields.hasErrors('details')}" th:errors="*{details}" class="text-red-500 text-xs mt-1"></p>

                    </div>
                    <div class="mb-4">
                        <label for="leftFileUpload" class="block text-sm font-medium text-gray-700">Upload Image</label>
                        <input type="file" id="leftFileUpload" name="featureImage"
                               class="mt-1 block w-full px-3 py-2 h-10 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <input type="number" name="testId" th:value="${productId}" style="display:none"/>
                    <div class="flex justify-between space-x-4">
                        <button type="submit"
                                class="bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600">Update</button>
                        <a href="category-list.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Go Back</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<script type="text/javascript" th:src="@{/js/demo.js}"></script>
</body>
</html>
