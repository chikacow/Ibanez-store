<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100">

    <!-- Sidebar -->
    <div class="flex">
        <div th:replace="admin/layout/sidebar :: sidebar"></div>

        <!-- Main content -->
        <div class="flex-1 flex flex-col h-screen overflow-y-scroll">
            <!-- Header -->
            <header class="bg-white shadow p-4 flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-semibold">Dashboard</h1>
                </div>
                <div class="flex items-center">
                    <input type="text" placeholder="Search..."
                        class="bg-gray-100 rounded-full px-4 py-2 focus:outline-none focus:ring focus:ring-blue-200">
                    <button class="ml-4 bg-blue-600 text-white px-4 py-2 rounded-full hover:bg-blue-700">Logout</button>
                </div>
            </header>

            <!-- Dashboard Content -->
            <main class="p-6">
                <!-- Stats Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">
                    <!-- Card 1 -->
                    <div class="bg-white p-6 rounded-lg shadow-lg">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-blue-500 text-white rounded-full flex items-center justify-center">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M12 4v16m8-8H4"></path>
                                </svg>
                            </div>
                            <div class="ml-4">
                                <h3 class="text-lg font-semibold">Total Users</h3>
                                <p class="text-gray-500">1,245</p>
                            </div>
                        </div>
                    </div>

                    <!-- Card 2 -->
                    <div class="bg-white p-6 rounded-lg shadow-lg">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-green-500 text-white rounded-full flex items-center justify-center">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M12 4v16m8-8H4"></path>
                                </svg>
                            </div>
                            <div class="ml-4">
                                <h3 class="text-lg font-semibold">New Signups</h3>
                                <p class="text-gray-500">345</p>
                            </div>
                        </div>
                    </div>

                    <!-- Card 3 -->
                    <div class="bg-white p-6 rounded-lg shadow-lg">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-red-500 text-white rounded-full flex items-center justify-center">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M12 4v16m8-8H4"></path>
                                </svg>
                            </div>
                            <div class="ml-4">
                                <h3 class="text-lg font-semibold">Active Sessions</h3>
                                <p class="text-gray-500">567</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Other Dashboard Content -->
                <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
                    <h2 class="text-xl font-semibold mb-4">Recent Activity</h2>
                    <div>
                        <!-- Add your recent activity content here -->
                    </div>
                </div>

            </main>
        </div>
    </div>

</body>

</html>
