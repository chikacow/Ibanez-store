<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
  <meta charset="UTF-8">
  <title>Update artist</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/demo.css}">
</head>
<body>
<h1>Update artist info</h1>
<form role="form"
      method="post"
      enctype="multipart/form-data"
      th:action="@{/admin/artist/update/{id} (id = ${alterArtist.id})}"
      th:object="${alterArtist}"
>
  <input type="text" th:field="*{id}"/>

  <label>Name: </label>
  <input type="text" th:field="*{name}" />
  <br/>
  <label>Bio:</label>
  <input type="text" th:field="*{bio}" />
  <br/>
  <label>Nationality: </label>
  <input type="text" th:field="*{nationality}" />
  <br/>
  <label>Band: </label>
  <input type="text" th:field="*{band}" />
  <br/>
  <label>Signature Model: </label>
  <input type="text" th:field="*{signatureModel}"/>
  <br/>
  <label>Image: </label>
  <input type="file" name="artistImg" />
  <br/>
  <label>Category: </label>
  <select th:field="*{category}">
    <option th:each="cate : ${cateList}" th:value="${cate.id}" th:text="${cate.name}" th:selected="${cate.id == alterArtist.category}"></option>
  </select>
  <br/>

  <h3>Signature Product</h3>
  <ul th:each="sigProduct, sigProductStat : ${signatureProductList} ">
    <li th:text="${sigProduct.artist.name}"></li>
    <li th:text="${sigProduct.product.name}"></li>
    <li th:text="${sigProduct.product.productLine.name}"></li>

    <li><a th:href="@{/admin/product/update/{id} (id = ${sigProduct.product.id} , fromSignature=true)}">wanna update this sigprod? </a></li>

  </ul>

  <button type="submit">Update artist</button>
</form>

<form role="form"
      method="post"
      th:action="@{/admin/signature-product/assign-to-artist (artistId = ${alterArtist.id}, fromArtistUpdate=true)}"
      th:object="${blankProduct}">
  <h4>Have this artist deserve signature products ?</h4>
  <br/>
  <label>Enter product name: </label>
  <input type="text" th:field="*{name}" />
  <br/>
  <span>Create a signature product for this artist ? -> <a th:href="@{/admin/signature-product/create (artistId=${alterArtist.id}) }">create now</a></span>

  <button type="submit">Add</button>
</form>


<script type="text/javascript" th:src="@{/js/demo.js}"></script>
</body>
</html>
