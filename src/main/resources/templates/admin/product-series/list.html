<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>List product series</title>
    <link th:href="@{https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css}" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/demo.css}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<div class="flex">
    <!-- Sidebar -->
    <div th:replace="admin/layout/sidebar :: sidebar"></div>
    <!-- Main content -->
    <div class="flex-1 flex flex-col h-screen overflow-y-scroll">
        <!-- Header -->
        <header class="bg-white shadow p-4 flex justify-between items-center">
            <h1 class="text-2xl font-semibold">Product Series Management</h1>
            <input type="text" placeholder="Search Product Series..."
                   class="bg-gray-100 rounded-full px-4 py-2 focus:outline-none focus:ring focus:ring-blue-200">
        </header>

        <!-- Main Content -->
        <main class="p-6">
            <div class="flex justify-end mb-4">
                <a th:href="@{/admin/product-series/create}" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                    Add New Product Series
                </a>
            </div>

            <!-- Product Line List -->
            <div class="bg-white p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-semibold mb-4">Product Series</h2>
                <table class="min-w-full bg-white">
                    <thead>
                    <tr>
                        <th class="w-1/16 px-4 py-2 text-left text-sm font-semibold text-gray-600">No.</th>
                        <th class="w-1/4 px-4 py-2 text-left text-sm font-semibold text-gray-600">Product Series Name</th>
                        <th class="w-1/3 px-4 py-2 text-left text-sm font-semibold text-gray-600">Category</th>
                        <th class="w-1/3 px-4 py-2 text-sm font-semibold text-gray-600">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Example Category Row -->
                    <tr class="border-b" th:each = "prs, prsStat : ${prodSeriesList}">
                        <td class="px-4 py-2" th:text="${prsStat.index + 1}"></td>
                        <td class="px-4 py-2" th:text="${prs.name}"></td>
                        <td class="px-4 py-2" th:text="${prs.productLine.category.name}"></td>
                        <td class="px-4 py-2 flex justify-around space-x-2">
                            <a th:href="@{/admin/product-series/{id} (id = ${prs.id})}" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">View Details</a>
                            <a th:href="@{/admin/product-series/update/{id} (id = ${prs.id})}" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">Edit</a>
                            <form method="get" th:action="@{/admin/product-series/delete/{id} (id=${prs.id}) }">
                                <button class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">Delete</button>
                            </form>
                            <!--                        <a th:href="@{/admin/category/delete/{id} (id = ${cate.id})}" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">View Details</a>-->
                        </td>
                    </tr>

                    <!-- Add more rows as needed -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>


<script type="text/javascript" th:src="@{/js/demo.js}"></script>
</body>
</html>
