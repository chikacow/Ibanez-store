<div class="flex">
    <!-- Sidebar -->
    <div th:replace="admin/layout/sidebar :: sidebar"></div>

    <!-- Main content -->
    <div class="flex-1 flex flex-col h-screen overflow-y-scroll">
        <!-- Header -->
        <header class="bg-white shadow p-4">
            <h1 class="text-2xl font-semibold">Update Category</h1>
        </header>

        <!-- Main Content -->
        <main class="p-6">
<!--            <div class="bg-white p-6 rounded-lg shadow-lg max-w-4xl mx-auto">-->
            <div class="bg-white p-6 rounded-lg shadow-lg max-w-md mx-auto">
                <h2 class="text-xl font-semibold mb-4">Edit Category Details</h2>
                <form role="form"
                      method="post"
                      th:action="@{/admin/category/update/{id} (id=${alterCategory.id})}"
                      th:object="${alterCategory}"
                >
                    <!-- Category ID -->
                    <div class="mb-4">
                        <label for="categoryId" class="block text-sm font-medium text-gray-700">Category ID</label>
                        <input type="text" th:field="*{id}" id="categoryId" name="categoryId" readonly
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-gray-100 sm:text-sm">

                    </div>
                    <input type="hidden" th:field="*{id}"/>

                    <input type="hidden" th:field="*{productLineList}"/>

                    <!-- Category Name -->
                    <div class="mb-4">
                        <label for="categoryName" class="block text-sm font-medium text-gray-700">Category Name</label>
                        <input type="text" th:field="*{name}" id="categoryName" name="categoryName" value="Sample Category"
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-500 text-xs mt-1">Category name is required.</p>
                    </div>

                    <!-- Description -->
                    <div class="mb-4">
                        <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                        <textarea id="description" th:field="*{description}" name="description" rows="4" placeholder="Enter category description"
                                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                        <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-red-500 text-xs mt-1">Category name is required.</p>
                    </div>

                    <!-- Form Buttons -->
                    <div class="flex justify-between space-x-4">
                        <button type="submit"
                                class="bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600">Update Category</button>

                        <a href="javascript:history.back()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Go Back</a>
                    </div>

                </form>

            </div>

        </main>
    </div>
</div>

<script type="text/javascript" th:src="@{/js/demo.js}"></script>
</body>
</html>
