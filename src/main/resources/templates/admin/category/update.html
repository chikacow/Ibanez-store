<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Update category</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/demo.css}">
</head>
<body>
<h2>Update the category</h2>
<p>Below are the old information</p>
<form role="form"
      method="post"
      th:action="@{/admin/category/update/{id} (id=${alterCategory.id})}"

      th:object="${alterCategory}"
>
    <!--/* or @{create} */-->

    <label>Category name:</label>
    <input type="text" th:field="*{name}"/>
    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    <br/>
    <label>Category description:</label>
    <input type="text" th:field="*{description}"/>
    <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
    <br/>

    <p th:text="${alterCategory.description}"></p>

    <button type="submit">Create</button>

</form>


<script type="text/javascript" th:src="@{/js/demo.js}"></script>
</body>
</html>
