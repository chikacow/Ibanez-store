<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Create signature product</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/demo.css}">
</head>
<body>
<h2>Create a signature product</h2>
<form role="form"
      method="post"
      enctype="multipart/form-data"
      th:object="${newProduct}"
      th:action="@{/admin/signature-product/create (artistId=${artistId}) }">
    artist id: <input type="text" th:text="${artistId}"/>
    <br/>
    <input type="number" style="display:none" th:field="*{id}"/>
    <label>Name: </label>
    <input type="text" th:field="*{name}"/>
    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    <br/>
    <label>Description: </label>
    <input type="text" th:field="*{description}"/>
    <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
    <br/>

    <label>Product series: </label>-->
        <select th:field="*{productSeries}">

            <option th:each="prodSeries, prodSeriesStat : ${prodSeriesList}" th:value="${prodSeries.id}" th:text="${prodSeries.name}"></option>
        </select>
    <br/>
    <label for="productImg">Images: </label>
    <input id="productImg" name="productImg" type="file"/>

    <br/>
    <label>Colors: </label>
    <ul th:each="color, colorStat : ${colorList}">
        <li th:text="${color.id}"></li>
        <li th:text="${color.name}"></li>
        <li th:text="${color.alias}"></li>
        <li th:text="${color.colorCode}"></li>
    </ul>

    <br/><br/>

    <label>Features: </label>
    <ul th:each="feature, featureStat : ${featureList}">
        <li th:text="${feature.id}"></li>
        <li th:text="${feature.title}"></li>
        <li th:text="${feature.details}"></li>
        <li th:text="${feature.image}"></li>
        <img th:src="@{/images/features/{pics} (pics = ${feature.image})}" style="width: 100px; height:100px" >
    </ul>

    <button type="submit">Create Product</button>
</form>

<br/><br/>

<h2>Create new feature for above product</h2>
<form role="form"
      method="post"
      enctype="multipart/form-data"
      th:object="${newFeature}"
      th:action="@{/admin/feature/create/{id} (id=${productId}, fromSignature=true)}"
>
    <!--    <input type="number" th:field="*{id}" />-->

    <label>Title</label>
    <input type="text" th:field="*{title}"/>
    <br/>
    <label>Details</label>
    <input type="text" th:field="*{details}" />
    <br/>
    <label>Image</label>
    <input type="file" name="featureImage" />
    <!--    th:field="*{image}"-->
    <br/>
    <label>hidden productId</label>
    <input type="number" name="testId" th:value="${productId}" style="display:block"/>
    <p>Count: <span th:text="${productId}"></span></p>


    <button type="submit">Create new Feature</button>


</form>

<br/><br/>
<h2>Create new color for above product</h2>
<form role="form"
      method="post"
      enctype="multipart/form-data"
      th:object="${newColor}"
      th:action="@{/admin/color/create/{id} (id=${productId})}"
>
    <label>Color code: </label>
    <input type="text" th:field="*{colorCode}"/>
    <br/>
    <label>Color name: </label>
    <input type="text" th:field="*{name}"/>
    <br/>
    <label>Color alias: </label>
    <input type="text" th:field="*{alias}"/>
    <br/>
    <label>Image</label>
    <input type="file" name="colorImg" />
    <br/>
    <button type="submit">Create new Color</button>


</form>


<script type="text/javascript" th:src="@{/js/demo.js}"></script>
</body>
</html>
