<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Create prod line</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/demo.css}">
</head>
<body>
<h2>Create new product line</h2>
<form role="form"
      method="post"
      th:action="create"
      th:object="${newProductLine}"
>
    <label>Name: </label>
    <input type="text" th:field="*{name}"/>
    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    <br/>
    <label>Description: </label>
    <input type="text" th:field="*{description}"/>
    <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
    <br/>
    <label>Select category: </label>
    <select th:field="*{category}">
<!--        <option value="" disabled>Select a category</option>-->
        <option th:each="cate : ${categoryList}" th:value="${cate.id}" th:text="${cate.name}"></option>
<!--        time for dto-->
    </select>

    <button type="submit">Create</button>

</form>


<script type="text/javascript" th:src="@{/js/demo.js}"></script>
</body>
</html>
